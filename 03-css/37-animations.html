<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37-Animation</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        section {
            div.jungle {
                background: url(imgs/jungle.png) no-repeat center top /contain;
                height: 460px;
                margin: 0.4rem auto;
                position: relative;
                overflow: hidden;
                width: 380px;

                img {
                    position: absolute;

                    &.logo {
                        top: 30px;
                        left: 30px;
                        animation: 2.5s animLogo infinite ease;
                    }
                    &.dk {
                        top: 184px;
                        left: 120px;
                        width: 140px;
                        animation: 2s animDK infinite linear;
                    }
                }
                div.move {
                    width: 120px;
                    position: absolute;
                    bottom: 0px;
                    animation: 4s animMove infinite linear;
                    left: -140px;
                    img.ryno {
                        position: absolute;
                        bottom: 60px;
                        width: 120px;
                        animation: 0.5s animRyno infinite ease;
                    }
                }
            }
        }
        @keyframes animLogo {
            0%,100% { transform: scale(0.8);}
            50%     { transform: scale(1.2);}
        }
        @keyframes animDK {
            0%      { transform: rotateY(0deg) translateY(0px);}
            25%     { transform: rotateY(0deg) translateY(-80px);}
            50%      { transform: rotateY(180deg) translateY(-80px);}
            75%      { transform: rotateY(0deg) translateY(-80px);}
            100%      { transform: rotateY(0deg) translateY(0px);}
        }
         @keyframes animRyno{
            0% ,100%  { transform: translateY(0px);}
            50%       { transform: translateY(-4px);}
        
        }
        @keyframes animMove{
            0%   { transform: rotateY(0deg)    ; bottom: 0px; left:-140px ;}
            8%   { transform: rotateY(0deg)    ; bottom: 0px; left: 120px ;}
            10%  { transform: rotateY(0deg)    ; bottom: 90px; left: 120px ;}
            12%  { transform: rotateY(0deg)    ; bottom: 0px; left: 120px ;}
            50%  { transform: rotateY(0deg)    ; bottom: 0px; left: 400px ;}
            51%  { transform: rotateY(-180deg) ; bottom: 0px; left: 400px ;}
            52%  { transform: rotateY(-180deg) ; bottom: 0px; left :400px ;}
            60%  { transform: rotateY(-180deg) ; bottom: 0px; left :120px ;}
            62%  { transform: rotateY(-180deg) ; bottom: 90px; left :120px ;}
            64%  { transform: rotateY(-180deg) ; bottom: 0px; left :120px ;}
            99%  { transform: rotateY(-180deg) ; bottom: 0px; left:-140px ;}
            100% { transform: rotateY(0deg)    ; bottom: 0px; left:-140px ;}
        
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M128,26A102,102,0,1,0,230,128,102.12,102.12,0,0,0,128,26Zm0,192a90,90,0,1,1,90-90A90.1,90.1,0,0,1,128,218Zm46-90a6,6,0,0,1-6,6H102.49l21.75,21.76a6,6,0,1,1-8.48,8.48l-32-32a6,6,0,0,1,0-8.48l32-32a6,6,0,0,1,8.48,8.48L102.49,122H168A6,6,0,0,1,174,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu">
            <h1>37-Animation</h1>
            <img src="../src/imgs/logo-css.png" alt="">
            <h3> Feature using @keyframes to create multi-step keyframed visual changes without JavaScript intervention.</h3>
        </header>
        <section>
            <div class="jungle">
                <img src="imgs/logo-dk.png" class="logo">
                <img src="imgs/dk.png" class="dk">
                <div class="move">
                    <img src="imgs/ryno.png" class="ryno">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
