<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-percentage Units</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        main {
            width: 100%;
            section.percentage {
                margin: 0 auto;
                width: 80%;
                div.parent {
                    display: flex;
                    align-items: center;
                    justify-content: center; 
                    div {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        height: 50vh;
                        font-size: 3rem;
                        &.child1 {
                            background: salmon;
                            width: 70%;
                        }
                        &.child2 {
                            background: darkorchid ;
                            width: 30%;
                        }
                    }
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M128,26A102,102,0,1,0,230,128,102.12,102.12,0,0,0,128,26Zm0,192a90,90,0,1,1,90-90A90.1,90.1,0,0,1,128,218Zm46-90a6,6,0,0,1-6,6H102.49l21.75,21.76a6,6,0,1,1-8.48,8.48l-32-32a6,6,0,0,1,0-8.48l32-32a6,6,0,0,1,8.48,8.48L102.49,122H168A6,6,0,0,1,174,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu">
            <h1>10-percentage Units</h1>
            <img src="../src/imgs/logo-css.png" alt="">
            <h3>Are relative to the size of the parent element.</h3>
        </header>
        <section class="percentage">
            <h2 class="subtitle">Example:</h2>
            <div class="parent">
                <div class="child1">70%</div>
                <div class="child2">30%</div>
            </div>
        </section>
    </main>
</body>
</html>
