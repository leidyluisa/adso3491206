<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40-Steps</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        :root {
            --size: 256px;
        }
        body {
                overflow: hidden;
                
        }
        section {
            div.bg {
                background: url(imgs/bg-steps.png) 
                            no-repeat center / cover ;
                border-radius: 12px;
                outline: 4px solid #fff;
                corner-shape: squircle;
                position: relative;
                height: 480px;

                div.info {
                    background-color: #0009;
                    border-radius: 12px;
                    corner-shape: squircle;
                    color: #fff;
                    font-size: 1.6rem;
                    text-align: center;
                    position: absolute;
                    top: 0.8rem;
                    left: 0.8rem;
                    padding: 0.4rem;
                    width: 300px;
                }

                div#trainer {
                    background: url(imgs/steps-all.png) no-repeat;
                    background-position-x: 0;
                    transform: scale(.8);
                    height: var(--size);
                    width: var(--size);
                    position: absolute;
                    bottom: 0;
                    left: 4rem;

                    animation: 0.6s animTrainer steps(4) infinite ;

                    &.front { background-position-y: calc(var(--size) * 0) ;}
                    &.left { background-position-y: calc(var(--size) * -1) ;}
                    &.right { background-position-y: calc(var(--size) * -2) ;}
                    &.back { background-position-y: calc(var(--size) * -3) ;}
                    
                }
            }
        }
@keyframes animTrainer {
    100% {background-position-x: -1024px ;}
}
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M128,26A102,102,0,1,0,230,128,102.12,102.12,0,0,0,128,26Zm0,192a90,90,0,1,1,90-90A90.1,90.1,0,0,1,128,218Zm46-90a6,6,0,0,1-6,6H102.49l21.75,21.76a6,6,0,1,1-8.48,8.48l-32-32a6,6,0,0,1,0-8.48l32-32a6,6,0,0,1,8.48,8.48L102.49,122H168A6,6,0,0,1,174,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu">
            <h1>40-Steps</h1>
            <img src="../src/imgs/logo-css.png" alt="">
            <h3>Timing function (steps()) used in CSS animations.</h3>
        </header>
        <section>
            <h2 class="subtitle">Example:</h2>
            <div class="bg">
                <div class="info">
                    Please press arrow keys:<br>
                    &larr; &uarr; &rarr; &darr;
                </div>
                <div id="trainer" class="front"></div>
            </div>
        </section>
    </main>
    <script>
        const trainer = document.getElementById('trainer');
        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'ArrowUp':
                    trainer.className = 'front';
                    break;
                case 'ArrowDown':
                    trainer.className = 'back';
                    break;
                case 'ArrowLeft':
                    trainer.className = 'left';
                    break;
                case 'ArrowRight':
                    trainer.className = 'right';
                    break;
            }
        });
    </script>
</body>
</html>
