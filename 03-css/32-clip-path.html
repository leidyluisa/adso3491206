<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-Clip Path</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        div.clip {
            background: url(imgs/pittsburgh.jpg) no-repeat center;
            background-size: cover;
            height: 280px;
            margin-block: 1rem;
            margin-inline: auto;
            transition: all 0.4s ease-in;
            width: 320px;
        }
        div.clip1 {
            clip-path: polygon(50% 0, 50% 0, 100% 100%, 0% 100%);
        }
        div.clip2 {
            clip-path: polygon(20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30%);
        }
        div.clip1:hover {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
        }
        div.clip2:hover {
            clip-path: polygon(20% 0%, 0% 20%, 0 50%, 0% 80%, 20% 100%, 49% 100%, 80% 100%, 100% 80%, 100% 50%, 100% 20%, 80% 0%, 50% 0);
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M128,26A102,102,0,1,0,230,128,102.12,102.12,0,0,0,128,26Zm0,192a90,90,0,1,1,90-90A90.1,90.1,0,0,1,128,218Zm46-90a6,6,0,0,1-6,6H102.49l21.75,21.76a6,6,0,1,1-8.48,8.48l-32-32a6,6,0,0,1,0-8.48l32-32a6,6,0,0,1,8.48,8.48L102.49,122H168A6,6,0,0,1,174,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu">
            <h1>32-Clip Path</h1>
            <img src="../src/imgs/logo-css.png" alt="">
            <h3> Property that creates a clipping region defining which parts of an element are visible (using shapes like circle(), polygon(), or SVG paths).</h3>
        </header>
        <section>
            <h2 class="subtitle">Example 01:</h2>
            <div class="clip clip1"></div>
            <h2 class="subtitle">Example 02:</h2>
            <div class="clip clip2"></div>
        </section>
    </main>
</body>
</html>
