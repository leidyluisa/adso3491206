<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40-Steps</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        :root {
            --size: 256px;
        }
        section {
            div.bg {
                background: url(imgs/bg-steps.png) no-repeat center / cover ;
                border-radius: 12px;
                outline: 4px solid #fff;
                corner-shape: squircle;
                position: relative;
                height: 560px;

                div.trainer {
                    background: url(imgs/steps-all.png) no-repeat;
                    background-position-x: 0;
                    transform: scale(.8);
                    height: var(--size);
                    width: var(--size);
                    position: absolute;
                    bottom: 0;
                    left: 4rem;

                    animation: 0.6s animTrainer steps(4) infinite ;

                    &.front { background-position-y: calc(var(--size) * 0) ;}
                    &.left { background-position-y: calc(var(--size) * -1) ;}
                    &.right { background-position-y: calc(var(--size) * -2) ;}
                    &.back { background-position-y: calc(var(--size) * -3) ;}
                    
                }
            }
        }
@keyframes animTrainer {
    100% {background-position-x: -1024px ;}
}
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">

        </a>
    </nav>
    <main>
        <header class="mainmenu">
            <h1>40-Steps</h1>
            <img src="../src/imgs/logo-css.png" alt="">
            <h3>Timing function (steps()) used in CSS animations to split transitions into discrete frames, commonly used for frame-by-frame sprite animations.</h3>
        </header>
        <section>
            <h2 class="subtitle">Example:</h2>
            <div class="bg">
                <div class="trainer front"></div>
            </div>
        </section>
    </main>
</body>
</html>
