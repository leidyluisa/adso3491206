<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26-Border Radius</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        div{
            border: 4px solid #fff9;
            height: 150px;
            margin: 0 auto;
            width: 150px;
            &.bradius1 {
                border-radius: 50px;
            }
            &.bradius2 {
                border-radius: 40px 0;
            }
            &.bradius3 {
                border-radius: 140px 0 0 140px;
            }
            &.bradius4 {
                border-radius: 140px 0 140px 140px;
            }
            &.bradius5 {
                border-radius: 80px;
                corner-shape: squircle;
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M128,26A102,102,0,1,0,230,128,102.12,102.12,0,0,0,128,26Zm0,192a90,90,0,1,1,90-90A90.1,90.1,0,0,1,128,218Zm46-90a6,6,0,0,1-6,6H102.49l21.75,21.76a6,6,0,1,1-8.48,8.48l-32-32a6,6,0,0,1,0-8.48l32-32a6,6,0,0,1,8.48,8.48L102.49,122H168A6,6,0,0,1,174,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu">
            <h1>26-Border Radius</h1>
            <img src="../src/imgs/logo-css.png" alt="">
            <h3>Property defines the radius of the element's corners.</h3>
        </header>
        <section>
            <h2 class="subtitle">border-radius: 50%</h2>
            <div class="bradius1"></div>
            <h2 class="subtitle">border-radius: 40px 0</h2>
            <div class="bradius2"></div>
            <h2 class="subtitle">border-radius: 140px 0 0 140px</h2>
            <div class="bradius3"></div>
            <h2 class="subtitle">border-radius: 140px 0 140px 140px</h2>
            <div class="bradius4"></div>
            <h2 class="subtitle">corner-shape: squircle</h2>
            <div class="bradius5"></div>
        </section>
    </main>
</body>
</html>
