<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23-Sprite</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        div#runner {
            background: url(imgs/run-sprite.png) no-repeat;
            margin: 2rem auto;
            height: 256px;
            width: 256px;
            &.sp1 {background-position: calc(-256px * 0) 0;}
            &.sp2 {background-position: calc(-256px * 1) 0;}
            &.sp3 {background-position: calc(-256px * 2) 0;}
            &.sp4 {background-position: calc(-256px * 3) 0;}
            &.sp5 {background-position: calc(-256px * 4) 0;}
            &.sp6 {background-position: calc(-256px * 5) 0;}
        }
        div#dino {
            background: url(imgs/dino-sprite.png) no-repeat;
            margin: 2rem auto;
            height: 128px;
            width: 128px;
             &.sp1 {background-position: calc(-128px * 0) 0;}
            &.sp2 {background-position: calc(-128px * 1) 0;}
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M128,26A102,102,0,1,0,230,128,102.12,102.12,0,0,0,128,26Zm0,192a90,90,0,1,1,90-90A90.1,90.1,0,0,1,128,218Zm46-90a6,6,0,0,1-6,6H102.49l21.75,21.76a6,6,0,1,1-8.48,8.48l-32-32a6,6,0,0,1,0-8.48l32-32a6,6,0,0,1,8.48,8.48L102.49,122H168A6,6,0,0,1,174,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu">
            <h1>23-Sprite</h1>
            <img src="../src/imgs/logo-css.png" alt="">
            <h3>An image sprite is a collection of images put into a single image.</h3>
        </header>
        <section>
            <h2 class="subtitle">Runner:</h2>
            <div id="runner" class="sp1"></div>
            <h2 class="subtitle">Dino:</h2>
            <div id="dino" class="sp1"></div>
        </section>
    </main>
    <script>
        const runner       = document.getElementById('runner');
        const runnerSprite = 6;
        let runnerCount    = 1;
        setInterval(() => {
            if(runnerCount == runnerSprite ){
                runner.className = '';
                runnerCount = 1;
            } else {
                runner.className = '';
                runner.classList.add('sp'+ ++runnerCount);
            }
        },80);

        const dino       = document.getElementById('dino');
        const dinoSprite = 2;
        let dinoCount    = 1;
        setInterval(() => {
            if(dinoCount == dinoSprite ){
                dino.className = '';
                dinoCount = 1;
            } else {
                dino.className = '';
                dino.classList.add('sp'+ ++dinoCount);
            }
        },100);

    </script>
</body>
</html>
