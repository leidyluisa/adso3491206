<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31-Filters</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        section {
            img.filter {
                display: block;
                width: 160px;
                margin: 1rem auto;
                transition: all 0.4s ease-in;

                &.filter1 {
                    filter: grayscale(1);
                }
                
                &.filter2 {
                    filter: blur(6px);
                }

                &.filter3 {
                    filter: sepia(1);
                }

                &.filter4 {
                    filter: brightness(0.2);
                }

                &.filter5 {
                    filter: invert(1);
                }
                &.filter6 {
                    filter: drop-shadow(2px 2px 12px aqua);
                }
                &.filter7 {
                    filter:hue-rotate(120deg);
                }
                &:hover {
                    filter: none;
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M128,26A102,102,0,1,0,230,128,102.12,102.12,0,0,0,128,26Zm0,192a90,90,0,1,1,90-90A90.1,90.1,0,0,1,128,218Zm46-90a6,6,0,0,1-6,6H102.49l21.75,21.76a6,6,0,1,1-8.48,8.48l-32-32a6,6,0,0,1,0-8.48l32-32a6,6,0,0,1,8.48,8.48L102.49,122H168A6,6,0,0,1,174,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu">
            <h1>31-Filters</h1>
            <img src="../src/imgs/logo-css.png" alt="">
            <h3>Property (filter) applying graphical transformations (e.g., blur(), grayscale(), contrast(), drop-shadow()) to elements before display.</h3>
        </header>
        <section>
            <h2 class="subtitle">GrayScale</h2>
            <img class="filter filter1" src="imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">Blur</h2>
            <img class="filter filter2" src="imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">Sepia</h2>
            <img class="filter filter3" src="imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">Brightness</h2>
            <img class="filter filter4" src="imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">Invert</h2>
            <img class="filter filter5" src="imgs/inosuke.png" alt="Inosuke">
             <h2 class="subtitle">Drop-Shadow</h2>
            <img class="filter filter6" src="imgs/inosuke.png" alt="Inosuke">
            <h2 class="subtitle">Hue-Rotate</h2>
            <img class="filter filter7" src="imgs/inosuke.png" alt="Inosuke">
        </section>
    </main>
</body>
</html>
