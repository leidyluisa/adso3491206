<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36-Transitions</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        section {
            img {
                display: block;
                margin: 1rem auto;

                &.transition01 {
                    transition: transform 0.5s ease-in;

                    &:hover {
                        transform: scale(1.3);
                    }
                }
                &.transition02 {
                    transition: all 1s linear;

                    &:hover {
                        transform: rotate(-0.5turn);
                    }
                }
                &.transition03 {
                    transition: all 0.5s ease-in-out;

                    &:hover {
                        transform: rotateY(180deg);
                    }
                }
                &.transition04 {
                    transition: all  0.2s ease;

                    &:hover {
                        transform: translateX(80px);
                    }
                }
            }
            div.box {
                background-color: red;
                margin-bottom: 2rem;
                height: 100px;
                width: 100px;
                transition: width 0.5s ease, 
                            height 0.5s 0.5s ease-in,
                            background 1s 1s ease-out,
                            transform 0.5s 2s linear;

                &:hover {
                    height: 200px;
                    width: 380px;
                    background: #ff0;
                    transform: rotate(360deg);
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M128,26A102,102,0,1,0,230,128,102.12,102.12,0,0,0,128,26Zm0,192a90,90,0,1,1,90-90A90.1,90.1,0,0,1,128,218Zm46-90a6,6,0,0,1-6,6H102.49l21.75,21.76a6,6,0,1,1-8.48,8.48l-32-32a6,6,0,0,1,0-8.48l32-32a6,6,0,0,1,8.48,8.48L102.49,122H168A6,6,0,0,1,174,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu">
            <h1>36-Transitions</h1>
            <img src="../src/imgs/logo-css.png" alt="">
            <h3>Technique controlling the speed and timing curve when changing property values smoothly between state changes (e.g., on :hover).</h3>
        </header>
        <section>
            <h2 class="subtitle">Scale(1.3):</h2>
            <img class="transition01" src="imgs/dk.png" alt="DK">
            <h2 class="subtitle">Rotate(-0.5turn):</h2>
            <img class="transition02" src="imgs/dk.png" alt="DK">
            <h2 class="subtitle">RotateY(180deg):</h2>
            <img class="transition03" src="imgs/dk.png" alt="DK">
            <h2 class="subtitle">TranslateX(80px):</h2>
            <img class="transition04" src="imgs/dk.png" alt="DK">
            <h2 class="subtitle">Multiple:</h2>
            <div class="box"></div>
</section>
    </main>
</body>
</html>
